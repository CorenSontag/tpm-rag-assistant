[project]
name = "tpm-chatbot-api"
version = "0.1.0"
description = "Bilingual conversational agent over a Thai TPM document corpus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# tpm-rag (the retrieval layer) is deliberately NOT listed here.
#
# It is not published to any index, and it lives beside this package in the
# bundle rather than at a stable URL. The previous entry —
#   "tpm-rag @ git+https://github.com/YOUR-USERNAME/tpm-rag@main"
# — carried an unreplaced placeholder, so `pip install .` failed outright, and
# the ref was a moving branch anyway, which does not deliver the pinning its
# comment claimed. Nothing ever exercised it: setup\2-SETUP.ps1:45 installs
# tpm-rag from the sibling path with `-e`, then installs the deps below from
# config\requirements-api.txt.
#
# Install both parts the way setup does:
#   pip install -e ..\tpm-rag
#   pip install -e .
#
# If you need retrieval pinned against silent chunking changes, pin it where it
# is actually installed (2-SETUP.ps1) to a commit SHA, not a branch.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.59",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Test-only. `pip install -e .[dev]` to run tests/; the service itself never
# imports these. httpx is not optional for TestClient - it is what starlette
# drives the ASGI app with.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# Only tests/. The six test_*.py files in the repo root are stdlib-unittest
# scripts; two of them (test_chat.py, run_eval.py) call a real model and cost
# real money, so a bare `pytest` must never collect them by accident.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
