[project]
name = "tpm-rag"
version = "0.1.0"
description = "Retrieval over Thai-language scanned PDFs: OCR, chunking, embedding, vector search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "thai", "ocr", "qdrant", "embeddings", "retrieval"]

# Serving only. Search a collection and embed a query - that is all the API
# needs, and all the container should weigh. See the ingest extra below.
dependencies = [
    "openai>=1.59",
    "qdrant-client>=1.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The OCR and chunking toolchain, imported only by loader.py. These four were
# required dependencies until the production image came out at 919 MB - weight
# that Container Apps re-pays on every cold start, for code the serving path
# never calls. tpm_rag/__init__.py defers the loader import so an install
# without this extra is a working retrieval client.
#
# Anything that ingests needs it: setup/2-SETUP.ps1 installs "-e <path>[ingest]"
# and CI installs it too, because tests/test_import_weight.py can only prove
# the loader stays unimported in an environment where it *could* be imported.
ingest = [
    "llama-index-core>=0.12",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
]
# The reranker pulls in torch. Only install it if you intend to use it.
rerank = ["sentence-transformers>=3.0"]

# tpm-rag-ingest is the only one of these that needs the ingest extra; it
# imports load_and_chunk_pdf and will raise ImportError on fitz without it.
# grep, inspect, purge and reset talk to Qdrant and embed a query, so they work
# on a bare install - which is what makes them usable for diagnosing the
# deployed collection from inside the container.
[project.scripts]
tpm-rag-ingest = "tpm_rag.ingest:main"
tpm-rag-grep = "tpm_rag.grep:main"
tpm-rag-inspect = "tpm_rag.inspect:main"
tpm-rag-purge = "tpm_rag.purge:main"
tpm-rag-reset = "tpm_rag.reset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpm_rag"]
