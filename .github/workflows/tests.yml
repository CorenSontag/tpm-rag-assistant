# Phase 2 CI: the tests that need no key, no container and no money.
#
# Deliberately NOT in this workflow:
#   run_eval.py and test_chat.py. Both call a real model on every run. Putting
#   them on push would bill the account on every typo-fix commit. The
#   retrieval gate (fail under recall@5 75%) belongs in a separate workflow
#   that runs on demand and on release, once Qdrant Cloud and the key exist.

name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tpm-rag, then the API
        # tpm-rag is not on PyPI. It installs from the sibling path, the same
        # way setup/2-SETUP.ps1 does it locally - so CI and a fresh developer
        # machine fail the same way rather than one of them working by luck.
        #
        # [ingest] here even though the Dockerfile deliberately omits it.
        # tests/test_import_weight.py asserts that `import tpm_rag` does not
        # load fitz/pytesseract/PIL/llama_index, and that assertion is vacuous
        # in an environment where they are not installed at all - a bare
        # install would turn the guard against the 919 MB image into a test
        # that passes no matter what __init__.py does. It also covers the lazy
        # load_and_chunk_pdf path that ingest depends on.
        working-directory: repos
        run: |
          python -m pip install --upgrade pip
          pip install "./tpm-rag[ingest]"
          pip install "./tpm-chatbot-api[dev]"

      - name: Run the offline suites
        working-directory: repos/tpm-chatbot-api
        # No secrets are referenced. tests/_bootstrap.py supplies a dummy key
        # and installs a fake store (both by patching tpm_rag.QdrantStorage
        # around the import and by seeding app.store._store), so a run that
        # somehow reached the network would fail rather than quietly spend.
        #
        # Both suites, not just pytest. This step ran `pytest` alone until
        # 2026-11-09, which meant the 34 stdlib-unittest tests never ran in CI
        # at all - including the only two assertions that /health tells a
        # missing collection apart from an unreachable Qdrant.
        #
        # run_eval.py and test_chat.py are still excluded and must stay so:
        # they call a real paid model. pytest collects only tests/, and these
        # unittest targets are named explicitly rather than discovered, so
        # neither can be pulled in by accident.
        run: |
          pytest
          python -m unittest test_agent_loop test_api test_run_eval test_tools_escalation
          python -m unittest test_pacing
